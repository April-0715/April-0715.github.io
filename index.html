<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="April-0715 的个人博客 — 记录学习与思考">
    <title>April-0715's Blog</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ========== 导航栏 ========== -->
    <header>
        <nav class="navbar" id="navbar">
            <div class="navbar-inner">
                <a href="index.html" class="nav-logo">April-0715</a>
                <button class="nav-toggle" id="navToggle" aria-label="展开菜单">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <ul class="nav-links" id="navLinks">
                    <li><a href="#home" class="nav-link active">首页</a></li>
                    <li><a href="#about" class="nav-link">关于我</a></li>
                    <li><a href="contents.html" class="nav-link">博客文章</a></li>
                    <li><a href="#contact" class="nav-link">联系我</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- ========== 英雄区 ========== -->
    <section id="home" class="hero"></section>

    <!-- ========== 个人简介区 ========== -->
    <section id="about" class="about reveal">
        <div class="avatar-wrapper">
            <div class="avatar-ring"></div>
            <div class="avatar">
                <img src="https://avatars.githubusercontent.com/u/189837151?s=400&u=bcb21e147fb718691483a75c08c262e6e0cced7c&v=4" alt="April-0715's Avatar" width="150" height="150">
            </div>
        </div>
        <h2 class="name">April-0715</h2>
        <p class="intro">
            热爱技术与写作的全栈开发者。<br>
            专注于 Web 开发、开源贡献和个人知识管理。<br>
        </p>
        <div class="about-stats">
            <div class="stat-item">
                <span class="stat-num" id="articleCount" data-count="0">0</span>
                <span class="stat-label">篇文章</span>
            </div>
        </div>
    </section>

    <!-- ========== 文章区 ========== -->
    <section id="posts" class="works">
        <h3 class="section-title reveal">最新文章</h3>
        <p class="section-subtitle reveal">分享我的学习笔记与技术心得</p>
        <div class="works-grid" id="worksGrid">
            <!-- 由 JS 动态渲染 -->
        </div>
        <div class="works-more reveal">
            <a href="contents.html" class="btn btn-primary">查看全部文章</a>
        </div>
    </section>

    <!-- ========== 页脚 ========== -->
    <footer id="contact" class="footer">
        <div class="footer-inner">
            <div class="footer-brand">April-0715</div>
            <div class="footer-social">
                <a href="https://github.com/April-0715" title="GitHub" aria-label="GitHub">GitHub</a>
            </div>
            <p>&copy; 2025 April-0715's Blog. All rights reserved.</p>
            <p>部分图片素材取自网络，版权归原作者所有，若涉及侵权可私信本站下架处理。</p>
        </div>
    </footer>

    <!-- ========== 回到顶部 ========== -->
    <button class="back-to-top" id="backToTop" aria-label="回到顶部" title="回到顶部">↑</button>

    <script src="js/articles-data.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
